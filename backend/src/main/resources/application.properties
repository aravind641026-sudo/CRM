# ===================================================================
# Server Configuration
# ===================================================================
server.address=0.0.0.0
server.port=${PORT:8080}
server.servlet.context-path=/

# ===================================================================
# Spring Application
# ===================================================================
spring.application.name=calling-crm-backend

# ===================================================================
# PostgreSQL / Neon Database Credentials & Connection
# ===================================================================
# Supports standard cloud variables (Render, Neon, Supabase, Railway)
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:${DATABASE_HOST:localhost}}:${PGPORT:${DATABASE_PORT:5432}}/${PGDATABASE:${DATABASE_NAME:crmq}}?sslmode=require&reWriteBatchedInserts=true}}
spring.datasource.username=${DATABASE_USERNAME:${PGUSER:${SPRING_DATASOURCE_USERNAME:postgres}}}
spring.datasource.password=${DATABASE_PASSWORD:${PGPASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Optimized for Neon Serverless / Cloud pooler)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:30000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:600000}
spring.datasource.hikari.leak-detection-threshold=60000

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===================================================================
# Application Security & JWT Configuration
# ===================================================================
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Cross-Origin Resource Sharing (CORS) Configuration
# ===================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081,http://10.97.41.211:8081,http://192.168.1.43:8081,http://localhost:19006,http://192.168.1.43:5173}

# ===================================================================
# Google Sheets Integration
# ===================================================================
app.google-sheets.apps-script-url=${GOOGLE_APPS_SCRIPT_URL:${GOOGLE_SCRIPT_URL:}}
app.google-sheets.shared-secret=${GOOGLE_APPS_SCRIPT_SECRET:${GOOGLE_SCRIPT_SECRET:}}
app.google-sheets.batch-size=${GOOGLE_SHEETS_BATCH_SIZE:1000}
app.google-sheets.connect-timeout-ms=${GOOGLE_SHEETS_CONNECT_TIMEOUT_MS:10000}
app.google-sheets.read-timeout-ms=${GOOGLE_SHEETS_READ_TIMEOUT_MS:60000}
app.google-sheets.max-retries=${GOOGLE_SHEETS_MAX_RETRIES:2}

# ===================================================================
# Firebase Authentication Configuration
# ===================================================================
firebase.project-id=${FIREBASE_PROJECT_ID:callingcrm-9c9fd}
firebase.web-api-key=${FIREBASE_WEB_API_KEY:}
firebase.credentials-file=${FIREBASE_CREDENTIALS_FILE:}
firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.com.crm=${LOGGING_LEVEL_CRM:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}

# ===================================================================
# Call Tracking & Classification Configuration (Thresholds in Seconds)
# ===================================================================
app.calls.threshold.very-short=${CALL_THRESHOLD_VERY_SHORT:30}
app.calls.threshold.short=${CALL_THRESHOLD_SHORT:60}
