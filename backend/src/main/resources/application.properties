# ===================================================================
# Server Configuration
# ===================================================================
server.address=0.0.0.0
server.port=8080
server.servlet.context-path=/

# ===================================================================
# Spring Application
# ===================================================================
spring.application.name=calling-crm-backend

# ===================================================================
# MySQL Database Credentials & Connection
# (Edit your username and password below)
# ===================================================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:calling_crm}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:2004}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Application Security & JWT Configuration
# ===================================================================
app.jwt.secret=${JWT_SECRET:9a4f2c8d3e5b7a1f6c8e0d2b4a6c8e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c3d}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081,http://10.97.41.211:8081,http://192.168.1.43:8081,http://localhost:19006,http://192.168.1.43:5173}

# ===================================================================
# Google Sheets Integration
# ===================================================================
app.google-sheets.apps-script-url=${GOOGLE_APPS_SCRIPT_URL:https://script.google.com/macros/s/AKfycbzuicbaYTDeB1xFF925JE2JGp4Q6bETUuwNSCWHyNlApUTWEhhVPFXVKf7cWZc5IAbl/exec}
app.google-sheets.shared-secret=${GOOGLE_APPS_SCRIPT_SECRET:AKfycbzuicbaYTDeB1xFF925JE2JGp4Q6bETUuwNSCWHyNlApUTWEhhVPFXVKf7cWZc5IAbl}
app.google-sheets.batch-size=${GOOGLE_SHEETS_BATCH_SIZE:1000}
app.google-sheets.connect-timeout-ms=${GOOGLE_SHEETS_CONNECT_TIMEOUT_MS:10000}
app.google-sheets.read-timeout-ms=${GOOGLE_SHEETS_READ_TIMEOUT_MS:60000}
app.google-sheets.max-retries=${GOOGLE_SHEETS_MAX_RETRIES:2}

# ===================================================================
# Firebase Authentication Configuration
# ===================================================================
firebase.project-id=${FIREBASE_PROJECT_ID:callingcrm-9c9fd}
firebase.web-api-key=${FIREBASE_WEB_API_KEY:AIzaSyBFXGeQ0OytxoSKwgj8o1gdf7m7O0VwNEk}
firebase.credentials-file=${FIREBASE_CREDENTIALS_FILE:}

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.com.crm=INFO
logging.level.org.springframework.security=INFO

# ===================================================================
# Call Tracking & Classification Configuration (Thresholds in Seconds)
# ===================================================================
app.calls.threshold.very-short=${CALL_THRESHOLD_VERY_SHORT:30}
app.calls.threshold.short=${CALL_THRESHOLD_SHORT:60}
